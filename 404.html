<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found — Will Barker</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; color: #eef4f1; background: #071016; }
      main { width: min(620px, calc(100% - 40px)); }
      p:first-child { color: #6ee7d2; font-family: ui-monospace, monospace; text-transform: uppercase; letter-spacing: .12em; }
      h1 { margin: .5rem 0 1rem; font-size: clamp(3rem, 12vw, 7rem); line-height: .9; letter-spacing: -.06em; }
      p { color: #9aaca8; font-size: 1.08rem; line-height: 1.65; }
      a { display: inline-block; margin-top: 1rem; padding: .75rem 1rem; color: #071016; background: #6ee7d2; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p>Error 404</p>
      <h1>Nothing at this coordinate.</h1>
      <p>The page may have moved, or the address may be incomplete.</p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
